name: Daily Blog Generator

on:
  schedule:
    # Runs at 06:00 UTC (11:30 AM IST) daily
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime with a button click

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Run Blog Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Commit and Push New Post
        run: |
          git config --global user.name "Digital Human Bot"
          git config --global user.email "bot@thatdigitalhuman.com"
          git add _posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add automated daily blog post [skip ci]" && git push)
